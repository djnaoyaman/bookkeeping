name: Deploy IL MASTRO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Generate static pages and metadata
        run: python scripts/build_discovery.py
      - name: Validate discovery metadata
        run: python scripts/check_discovery.py
      - name: Validate application scripts
        run: |
          for script in dist/*.js; do node --check "$script"; done
          node tests/assessment-engine.cjs
          node tests/assessment-session.cjs
          node tests/learning-course.cjs
          node tests/industrial-course.cjs
          node tests/industrial-labor.cjs
          node tests/industrial-expenses.cjs
          node tests/industrial-expenses-independent.cjs
          node tests/industrial-overhead.cjs
          node tests/industrial-overhead-independent.cjs
          node tests/industrial-departments.cjs
          node tests/industrial-departments-independent.cjs
          node tests/industrial-job-order.cjs
          node tests/industrial-job-order-independent.cjs
          node tests/industrial-process-average.cjs
          node tests/industrial-process-average-independent.cjs
          node tests/industrial-process-fifo.cjs
          node tests/industrial-process-fifo-independent.cjs
          node tests/industrial-cvp.cjs
          node tests/industrial-cvp-independent.cjs
          node tests/check.cjs
          node tests/discovery-client.cjs
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Regenerate public pages
        run: python3 scripts/build_discovery.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
