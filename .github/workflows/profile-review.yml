name: Profile review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pillow
      - run: python scripts/check_discovery.py
      - run: node tests/assessment-engine.cjs
      - run: node tests/assessment-session.cjs
      - run: node tests/learning-course.cjs
      - run: node tests/check.cjs
      - run: node tests/discovery-client.cjs
      - run: python profile-check.py
      - run: python history-check.py
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: python -m http.server 8765 --directory dist > /tmp/profile-server.log 2>&1 &
      - run: node profile-browser.cjs
      - run: node history-browser.cjs
      - run: node redesign-browser.cjs
      - run: node learning-course-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-review
          path: |
            profile-shots
            history-shots
            redesign-shots


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-review
          path: learning-shots
