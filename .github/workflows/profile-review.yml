name: Profile review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_discovery.py
      - run: node scripts/build_mock.cjs
      - run: node tests/mock-model.cjs
      - run: node tests/mock-form.cjs
      - run: node tests/assessment-engine.cjs
      - run: node tests/assessment-session.cjs
      - run: node tests/learning-course.cjs
      - run: node tests/nissho2-scope.cjs
      - run: node tests/industrial-course.cjs
      - run: node tests/check.cjs
      - run: node tests/discovery-client.cjs
      - run: python profile-check.py
      - run: python history-check.py
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: python -m http.server 8765 --directory dist > /tmp/profile-server.log 2>&1 &
      - run: node profile-browser.cjs
      - run: node history-browser.cjs
      - run: node redesign-browser.cjs
      - run: node course-integration-browser.cjs
      - run: node icon-browser.cjs
      - run: node mock-browser.cjs
      - run: node nissho2-scope-browser.cjs
      - run: node industrial-course-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-review
          path: |
            profile-shots
            history-shots
            redesign-shots
            icon-shots


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-integration-review
          path: course-integration-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-review
          path: mock-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nissho2-scope-review
          path: scope-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industrial-course-review
          path: industrial-shots
